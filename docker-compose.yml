services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_work_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_work_os"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_work_os
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FRONTEND_URL: http://localhost:3000
      UPLOAD_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  uploads:
